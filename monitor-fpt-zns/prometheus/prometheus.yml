      target_label: instance

  - job_name: 'Mysql-DB'
    scrape_interval: 10s
    static_configs:
      - targets: ['10.92.10.1:9104','10.92.10.2:9104','10.92.10.3:9104']
    relabel_configs:
    - source_labels: [__address__]
      separator: ':'
      regex: '(.*):(.*)'
      replacement: '${1}'
      target_label: instance

  - job_name: 'checkpoint-prod'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    static_configs:
      - targets: ['10.92.6.252']
        labels:
          display: 'ZNS-CP-GW-2_10.92.6.252'        
      - targets: ['10.92.6.253']
        labels:
          display: 'ZNS-CP-GW-1_10.92.6.253'
      - targets: ['10.151.90.235']
        labels:
          display: 'ZNS-CP-SMS_10.151.90.235'     
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [display]
        target_label: instance
      - source_labels: [__param_target]
        target_label: snmp_target          
      - target_label: __address__
        replacement: 10.92.6.112:9116
        
  - job_name: 'redis'
    metrics_path: /scrape
    static_configs:
      - targets:
        - 'redis://10.92.10.31:6379'
        - 'redis://10.92.10.32:6379'
        - 'redis://10.92.10.33:6379'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: redis-exporter:9121
      - source_labels: [__param_target]
        target_label: instance          
