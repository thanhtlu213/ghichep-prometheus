global:
  scrape_interval:     15s
  evaluation_interval: 15s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'zns monitoring'

# Alertmanager configuration
alerting:
  alertmanagers:
  - scheme: http
    static_configs:
    - targets:
      - 'alertmanager:9093'

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  - "node-exporter.rules"
  - "prometheus-self-monitoring.rules"
  - "nginx-exporter.rules"
  - "rabbitmq_alerts.rules"
  - "mysql-exporter.rules"

scrape_configs:
  - job_name: 'ZNS-API'
    scrape_interval: 10s
    static_configs:
      - targets: ['10.92.6.1:9100', '10.92.6.2:9100', '10.92.6.3:9100', '10.92.6.4:9100', '10.92.6.5:9100']
    relabel_configs:
    - source_labels: [__address__]
      separator: ':'
      regex: '(.*):(.*)'
      replacement: '${1}'
      target_label: instance

  - job_name: 'ZNS-Worker'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.92.10.101:9100', '10.92.10.102:9100', '10.92.10.103:9100', '10.92.10.104:9100', '10.92.10.105:9100']
    relabel_configs:
    - source_labels: [__address__]
      separator: ':'
      regex: '(.*):(.*)'
      replacement: '${1}'
      target_label: instance

  - job_name: 'ZNS-DLR'
    scrape_interval: 10s
    honor_labels: true
    static_configs:
      - targets: ['10.92.6.21:9100', '10.92.6.22:9100', '10.92.6.23:9100', '10.92.6.24:9100']
    relabel_configs:
    - source_labels: [__address__]
      separator: ':'
      regex: '(.*):(.*)'
      replacement: '${1}'
      target_label: instance

  - job_name: 'ZNS-RabbitMQ'
