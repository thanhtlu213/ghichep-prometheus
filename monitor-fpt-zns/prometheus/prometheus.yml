      - targets: ['10.92.6.31:9100', '10.92.6.32:9100', '10.92.6.33:9100']
    relabel_configs:
    - source_labels: [__address__]
      separator: ':'
      regex: '(.*):(.*)'
      replacement: '${1}'
      target_label: instance

  - job_name: 'ZNS-Redis'
